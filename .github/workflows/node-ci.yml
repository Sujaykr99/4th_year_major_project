name: Node CI

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies and build (if frontend present)
        run: |
          if [ -f frontend/package.json ]; then
            echo "Frontend detected — installing and building"
            cd frontend
            npm ci
            npm run build --if-present
          else
            echo "No frontend found; skipping npm install/build"
          fi
