name: Python CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies if present
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            echo "backend/requirements.txt missing; installing pytest only"
            pip install pytest
          fi
      - name: Run tests if present
        run: |
          if [ -d backend/tests ] && [ "$(find backend/tests -maxdepth 1 -type f | wc -l)" -gt 0 ]; then
            echo "Tests found - running pytest"
            pytest -q backend/tests
          else
            echo "No backend tests found; skipping pytest"
          fi
